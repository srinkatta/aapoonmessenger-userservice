<!DOCTYPE html>
<html>
<head>
    <title>Feedback</title>
</head>
<body>
    <p>Hello Support,</p>

    <p>Please check the feedback from {{ name }}.</p>

    <ul>
        <li>User Id: {{ user_id }}</li>
        <li>Email: {{ email }}</li>
        <li>Country Code: {{ country_code }}</li>
        <li>Phone: {{ phone }}</li>
        <li>Topic: {{ topic }}</li>
        <li>Content: {{ content }}</li>
        <li>Attachment : <a href="{{ url | safe }}">{{ url }}</a></li>
    </ul>

    <p>Thanks and Regards,<br>aapoon.</p>
</body>
</html>
